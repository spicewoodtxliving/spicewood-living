  <div class="wrap nl">
    <div class="sec-head" style="margin:0">
      <span class="label">The weekly email</span>
      <h1>This Week in Spicewood, every Monday</h1>
      <p>New openings, the weekend's live music, and what's being built along Hwy 71. Short, local, and free.</p>
    </div>
    <div class="form-card">
      <form id="nlForm" novalidate>
        <div class="row2">
          <label class="f">First name<input id="n_first" autocomplete="given-name" required></label>
          <label class="f">Last name<input id="n_last" autocomplete="family-name" required></label>
        </div>
        <label class="f">Email<input id="n_email" type="email" autocomplete="email" required></label>
        <button class="go" type="submit">Subscribe</button>
        <div id="nlStatus" class="status" hidden></div>
      </form>
    </div>
  </div>
